<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>SENTIR LA CALLE — Valparaíso / Buenos Aires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#713B85;
  --mauve:#A69DAA;
  --gray:#77727B;
  --light:#D8D5DA;
  --paper:#F4F2F5;
  --white:#FFFFFF;
  --black:#000000;
  --font:'Montserrat',sans-serif;
  --mono:'DM Mono',monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--black);
  font-family:var(--font);overflow-x:hidden;
}
body.intro-active{overflow:hidden}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--purple);color:white}

.mono{
  font-family:var(--mono);
  text-transform:uppercase;
  letter-spacing:.16em;
}
.eyebrow{
  font:10px var(--mono);
  letter-spacing:.19em;
  text-transform:uppercase;
}
.purple{color:var(--purple)}
.muted{color:var(--gray)}

#intro{
  position:fixed;inset:0;z-index:10000;
  display:flex;align-items:center;justify-content:center;
  background:#000;overflow:hidden;
  transition:opacity 1s ease,visibility 1s ease;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#introVector{
  position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;
  object-fit:contain;object-position:center;
}
#introTitle{
  position:absolute;z-index:2;margin:0;color:white;text-align:center;
  font-size:clamp(48px,11vw,140px);font-weight:800;
  line-height:.9;letter-spacing:-.025em;
  opacity:0;transform:translateY(25px) scale(.97);
  transition:opacity 1s ease,transform 1s var(--ease);
}
#intro.show-title #introVector{opacity:0}
#intro.show-title #introTitle{opacity:1;transform:translateY(0) scale(1)}
#skipIntro{
  position:absolute;right:5vw;top:30px;z-index:4;
  color:white;background:transparent;border:1px solid #777;
  padding:12px 16px;font:10px var(--mono);
  letter-spacing:.15em;transition:.3s;
}
#skipIntro:hover{background:var(--purple);border-color:var(--purple)}

.progress{
  position:fixed;top:0;left:0;height:3px;width:0;
  background:var(--purple);z-index:200;
}
.topbar{
  position:fixed;top:0;left:0;width:100%;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:23px 5vw;color:white;mix-blend-mode:difference;
}
.brand{font-size:11px;font-weight:800;letter-spacing:.17em}
.topbar nav{
  display:flex;gap:30px;
  font:9px var(--mono);letter-spacing:.17em;
}
.topbar nav a{opacity:.75;transition:opacity .3s}
.topbar nav a:hover{opacity:1}

.hero{
  min-height:100svh;background:var(--black);color:white;
  padding:140px 5vw 55px;position:relative;
  display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;
}
.hero::before,.hero::after{
  content:"";position:absolute;border:1px solid #302735;
  border-radius:50%;pointer-events:none;
}
.hero::before{width:65vw;height:65vw;right:-20vw;top:5%}
.hero::after{width:40vw;height:40vw;right:-7vw;top:21%}
.hero-meta{
  display:flex;justify-content:space-between;
  position:relative;z-index:2;
}
.hero h1{
  position:relative;z-index:2;margin:8vh 0 5vh;
  font-size:clamp(76px,16vw,220px);font-weight:800;
  line-height:.8;letter-spacing:-.045em;
}
.hero h1 span{display:block;color:var(--purple);padding-left:14vw}
.hero-bottom{
  position:relative;z-index:2;display:flex;
  justify-content:space-between;align-items:end;gap:30px;
}
.hero-bottom p{
  max-width:480px;font-size:clamp(15px,1.6vw,21px);
  line-height:1.7;letter-spacing:.035em;
}
.scroll-cue{font:10px var(--mono);color:#aaa;letter-spacing:.19em}
.hero-orbit{
  position:absolute;width:13px;height:13px;border-radius:50%;
  background:var(--purple);right:18%;top:42%;
  box-shadow:0 0 50px 20px #713b8540;
  animation:orbit 7s ease-in-out infinite alternate;
}
@keyframes orbit{to{transform:translate(-90px,120px) scale(1.8)}}

.marquee{
  overflow:hidden;background:var(--purple);color:white;
  padding:18px 0;white-space:nowrap;
}
.marquee-track{
  display:flex;width:max-content;
  animation:marquee 28s linear infinite;
}
.marquee span{
  font-size:11px;font-weight:700;
  letter-spacing:.23em;padding:0 30px;
}
@keyframes marquee{to{transform:translateX(-50%)}}

.section{padding:130px 7vw;position:relative}
.section-dark{background:var(--black);color:white}
.section-head{
  display:grid;grid-template-columns:1fr 2fr;
  gap:30px;margin-bottom:75px;align-items:start;
}
.section-index{
  font:10px var(--mono);
  letter-spacing:.2em;color:var(--purple);
}
.section h2{
  margin:0;font-size:clamp(40px,7vw,95px);
  line-height:1.02;letter-spacing:-.035em;font-weight:700;
}
.intro-copy{
  max-width:800px;margin-left:auto;
  font-size:clamp(20px,3vw,38px);
  line-height:1.5;letter-spacing:-.015em;
}
.intro-copy em{font-style:normal;color:var(--purple)}
.split-statement{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8vw;margin-top:100px;align-items:start;
}
.statement{border-top:1px solid var(--light);padding-top:22px}
.statement .number{font:10px var(--mono);letter-spacing:.2em;color:var(--purple)}
.statement h3{
  font-size:clamp(24px,3vw,40px);
  letter-spacing:-.025em;margin:30px 0 15px;
}
.statement p{
  max-width:390px;color:var(--gray);
  font-size:13px;line-height:1.9;letter-spacing:.025em;
}

.territories{background:var(--black);color:white}
.territory-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.territory{
  min-height:440px;padding:35px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  background:#171419;transition:background .6s var(--ease);
}
.territory:hover{background:var(--purple)}
.territory .territory-number{
  font:10px var(--mono);letter-spacing:.2em;color:var(--mauve);
}
.territory h3{
  font-size:clamp(38px,5vw,68px);line-height:1;
  letter-spacing:-.035em;margin:0;position:relative;z-index:2;
}
.territory p{
  max-width:330px;font-size:12px;
  line-height:1.9;letter-spacing:.025em;color:#c6c0ca;
}
.territory-shape{
  position:absolute;width:260px;height:260px;
  border:1px solid #6c5c72;border-radius:50%;
  right:-80px;top:90px;transition:transform 1s var(--ease);
}
.territory-shape::before,.territory-shape::after{
  content:"";position:absolute;border:1px solid #6c5c72;
  border-radius:50%;inset:30px;
}
.territory-shape::after{inset:70px}
.territory:hover .territory-shape{transform:scale(1.35) rotate(30deg)}

.data-section{background:var(--paper)}
.data-intro{
  max-width:780px;font-size:clamp(19px,2.4vw,29px);
  line-height:1.6;letter-spacing:-.015em;margin:0 0 65px;
}
.explorer{
  display:grid;grid-template-columns:minmax(190px,.65fr) minmax(0,2fr) minmax(230px,.85fr);
  border-top:1px solid var(--black);
  border-bottom:1px solid var(--black);
  min-height:680px;
}
.explorer-menu{padding:25px 22px 25px 0;border-right:1px solid var(--light)}
.explorer-menu-label{
  font:9px var(--mono);letter-spacing:.18em;
  color:var(--gray);margin-bottom:30px;
}
.dimension-button{
  display:block;width:100%;text-align:left;
  padding:18px 8px 18px 0;border:0;
  border-top:1px solid var(--light);
  background:transparent;color:var(--gray);
  font-size:12px;line-height:1.5;letter-spacing:.025em;
  transition:color .3s,padding .4s var(--ease);
}
.dimension-button span{
  display:block;font:9px var(--mono);
  letter-spacing:.2em;margin-bottom:8px;color:var(--mauve);
}
.dimension-button.active{color:var(--purple);padding-left:12px}
.dimension-button:hover{color:var(--purple);padding-left:12px}

.explorer-main{padding:30px 24px;min-width:0}
.explorer-heading{
  display:flex;justify-content:space-between;
  gap:20px;align-items:start;
}
.explorer-heading h3{
  font-size:clamp(24px,3vw,43px);
  letter-spacing:-.035em;line-height:1.1;margin:0;
}
.explorer-heading p{
  font:9px var(--mono);letter-spacing:.15em;
  color:var(--gray);white-space:nowrap;
}
.dimension-description{
  font-size:12px;line-height:1.9;letter-spacing:.025em;
  color:var(--gray);max-width:570px;margin:20px 0 25px;
}
.circle-stage{
  min-height:390px;position:relative;overflow:hidden;
  background:#ebe8ed;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
}
.circle-stage::before,.circle-stage::after{
  content:"";position:absolute;border:1px solid #c7bdcd;border-radius:50%;
}
.circle-stage::before{width:310px;height:310px}
.circle-stage::after{width:190px;height:190px}
.people-cloud{position:absolute;inset:0;z-index:2}
.person{
  position:absolute;width:32px;height:58px;
  left:50%;top:50%;opacity:0;
  transform:translate(-50%,-50%);
  transition:left 1.2s var(--ease),top 1.2s var(--ease),opacity .5s,filter .5s;
}
.person svg{width:100%;height:100%;overflow:visible}
.person .figure{fill:var(--purple)}
.person .limb{
  fill:none;stroke:var(--purple);stroke-width:4;
  stroke-linecap:round;transform-box:fill-box;
}
.person .arm-left{transform-origin:top center;animation:armA .55s ease-in-out infinite alternate}
.person .arm-right{transform-origin:top center;animation:armB .55s ease-in-out infinite alternate}
.person .leg-left{transform-origin:top center;animation:legA .55s ease-in-out infinite alternate}
.person .leg-right{transform-origin:top center;animation:legB .55s ease-in-out infinite alternate}
.person:nth-child(3n) .figure,.person:nth-child(3n) .limb{fill:var(--gray);stroke:var(--gray)}
.person:nth-child(4n) .figure,.person:nth-child(4n) .limb{fill:#4e3b58;stroke:#4e3b58}
.person.arrived{opacity:1}
.person.floating{animation:personFloat 1.2s ease-in-out}
@keyframes armA{to{transform:rotate(22deg)}}
@keyframes armB{to{transform:rotate(-22deg)}}
@keyframes legA{to{transform:rotate(-28deg)}}
@keyframes legB{to{transform:rotate(28deg)}}
@keyframes personFloat{
  0%,100%{filter:drop-shadow(0 0 0 transparent)}
  50%{filter:drop-shadow(0 7px 5px #713b8530);translate:0 -7px}
}
.stage-label{
  position:absolute;z-index:4;bottom:14px;left:17px;
  font:8px var(--mono);letter-spacing:.16em;color:#77727b;
}
.stage-center{
  position:absolute;z-index:4;font:8px var(--mono);
  color:var(--purple);text-align:center;letter-spacing:.17em;
  pointer-events:none;
}
.group-label{
  position:absolute;z-index:3;font:8px var(--mono);
  letter-spacing:.13em;color:#77727b;opacity:0;
  transition:opacity .5s;
}
.group-label.visible{opacity:1}
.stage-bottom{
  display:flex;justify-content:space-between;
  align-items:center;gap:15px;margin-top:20px;
}
.stage-note{
  font-size:9px;line-height:1.8;
  letter-spacing:.025em;color:var(--gray);max-width:340px;
}
.reorganize{
  border:0;background:var(--purple);color:white;
  padding:14px 15px;font:9px var(--mono);
  letter-spacing:.16em;white-space:nowrap;
  transition:transform .3s,background .3s;
}
.reorganize:hover{background:#4d2a5c;transform:translateY(-4px)}
.city-switch{display:flex;gap:6px;margin-top:22px;flex-wrap:wrap}
.city-switch button{
  border:1px solid var(--light);background:transparent;
  padding:9px 11px;font:8px var(--mono);
  letter-spacing:.13em;color:var(--gray);
}
.city-switch button.active{background:var(--black);color:white;border-color:var(--black)}

.info-panel{
  border-left:1px solid var(--light);
  padding:25px 0 25px 22px;min-width:0;
}
.info-top{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;margin-bottom:20px;
}
.info-top span{font:9px var(--mono);letter-spacing:.17em;color:var(--gray)}
.country-tabs{display:flex;gap:5px;margin-bottom:28px}
.country-tab{
  flex:1;padding:10px 6px;border:1px solid var(--light);
  background:transparent;font:8px var(--mono);
  letter-spacing:.12em;color:var(--gray);
}
.country-tab.active{background:var(--purple);color:white;border-color:var(--purple)}
.info-country{
  font-size:clamp(23px,2.3vw,32px);
  line-height:1.05;letter-spacing:-.035em;margin:0 0 10px;
}
.info-subtitle{
  font:8px var(--mono);letter-spacing:.16em;
  color:var(--purple);margin-bottom:25px;
}
.info-tabs{
  display:flex;flex-wrap:wrap;gap:6px;
  border-bottom:1px solid var(--light);padding-bottom:12px;
}
.info-tab{
  border:0;background:transparent;padding:7px 0;
  margin-right:10px;font:8px var(--mono);
  letter-spacing:.1em;color:var(--gray);
}
.info-tab.active{color:var(--purple);border-bottom:1px solid var(--purple)}
.info-content{padding-top:22px;min-height:265px}
.info-content h4{
  font-size:15px;letter-spacing:-.02em;margin:0 0 12px;
}
.info-content p{
  font-size:10px;line-height:1.9;
  letter-spacing:.015em;color:#66616b;margin:0 0 14px;
}
.info-content .fact{
  border-top:1px solid var(--light);
  padding:13px 0;margin-top:13px;
}
.info-content .fact strong{
  display:block;font:8px var(--mono);
  letter-spacing:.13em;color:var(--purple);margin-bottom:7px;
}
.info-source{
  border-top:1px solid var(--light);padding-top:15px;
  font:8px var(--mono);line-height:1.8;
  letter-spacing:.06em;color:var(--gray);
}
.info-source a{text-decoration:underline;text-underline-offset:3px}
.note{
  margin-top:25px;padding:18px 20px;
  background:#e8e3eb;border-left:3px solid var(--purple);
  font-size:10px;line-height:1.9;letter-spacing:.025em;color:#514a55;
}


.footer{
  padding:35px 7vw;background:var(--black);color:white;
  display:flex;justify-content:space-between;gap:20px;
  font:9px var(--mono);letter-spacing:.18em;
}
.reveal{
  opacity:0;transform:translateY(45px);
  transition:opacity .9s var(--ease),transform .9s var(--ease);
}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:1100px){
  .explorer{grid-template-columns:180px minmax(0,1fr)}
  .info-panel{
    grid-column:1/-1;border-left:0;border-top:1px solid var(--light);
    padding:25px 0;display:grid;grid-template-columns:220px 1fr;gap:25px;
  }
  .info-panel .info-top,.info-panel .country-tabs{grid-column:1/-1}
  .info-panel .info-top{margin-bottom:0}
  .info-panel .info-content{min-height:180px}
}
@media(max-width:800px){
  .topbar nav{gap:13px}
  .section{padding:90px 6vw}
  .section-head{grid-template-columns:1fr;gap:20px;margin-bottom:45px}
  .split-statement,.territory-grid{grid-template-columns:1fr}
  .territory{min-height:350px}
  .explorer{grid-template-columns:1fr}
  .explorer-menu{
    border-right:0;padding:15px 0;
    display:grid;grid-template-columns:1fr 1fr;gap:0 15px;
  }
  .explorer-menu-label{grid-column:1/-1}
  .explorer-main{padding:25px 0}
  .info-panel{display:block}
}
@media(max-width:520px){
  .topbar{padding:18px 5vw}
  .topbar nav{gap:9px;font-size:8px}
  .topbar nav a:nth-child(2){display:none}
  .topbar nav a:nth-child(3){display:none}
  .hero{padding:120px 6vw 40px}
  .hero h1{font-size:19vw;margin:13vh 0}
  .hero h1 span{padding-left:5vw}
  .hero-bottom{display:block}
  .scroll-cue{margin-top:35px}
  .hero-meta{font-size:8px}
  .territory{min-height:310px;padding:25px}
  .circle-stage{min-height:350px}
  .person{width:25px;height:48px}
  .stage-bottom{align-items:start;flex-direction:column}
  .explorer-heading{display:block}
  .explorer-heading p{margin-top:12px}
  .footer{flex-direction:column}
  #skipIntro{top:18px;right:5vw;font-size:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

.signal-section{background:#090909;color:#fff}
.signal-section .section-index{color:#c45a32}
.signal-lead{max-width:850px;margin:0 0 55px auto;font-size:clamp(19px,2.4vw,30px);line-height:1.55;color:#d0cbd0}
.signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.signal-city{background:#171717;padding:clamp(24px,4vw,55px);display:grid;grid-template-columns:1fr 1fr;gap:25px;min-height:490px}
.signal-city-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid #454045;padding-bottom:20px}
.signal-city-head h3{font-size:clamp(36px,5vw,66px);line-height:.95;letter-spacing:-.05em;margin:0}
.signal-city-head .eyebrow{color:#d77a52}
.signal-visual{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#222}
.signal-pole{position:absolute;width:8px;height:175px;background:#555;left:50%;top:28px;transform:translateX(-50%);z-index:0}
.signal-head{z-index:1;background:#080808;border:2px solid #666;border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:12px}
.lamp{width:37px;height:37px;border-radius:50%;display:block;border:2px solid #555;background:#242424}
.lamp.red{background:#d12f2f;box-shadow:0 0 20px #d12f2f55}
.lamp.green{background:#319b5c;box-shadow:0 0 20px #319b5c55}
.lamp.white{background:#f1f1f1;box-shadow:0 0 20px #ffffff55}
.signal-caption{position:absolute;bottom:15px;font:8px var(--mono);letter-spacing:.12em;color:#aaa;text-align:center}
.signal-copy h4{font:10px var(--mono);letter-spacing:.16em;color:#d77a52;margin:0 0 10px}
.signal-copy p{font-size:11px;line-height:1.85;color:#c8c3c8;margin:0 0 22px}
.signal-bottom{display:grid;grid-template-columns:1fr 1fr;gap:35px;padding:30px 0;border-top:1px solid #454045;border-bottom:1px solid #454045;margin-top:12px}
.signal-bottom .eyebrow,.culture-title .eyebrow{color:#d77a52}
.signal-bottom p,.culture-copy p{font-size:12px;line-height:1.9;color:#c8c3c8}
.culture-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:50px;padding:75px 0 45px}
.culture-title h3{font-size:clamp(34px,5vw,65px);line-height:.98;letter-spacing:-.05em;margin:20px 0}
.culture-copy p{margin:0 0 18px}
.culture-copy strong{color:#fff}
.signal-sources{display:flex;flex-wrap:wrap;gap:12px 22px;padding-top:20px;border-top:1px solid #454045;font:8px var(--mono);letter-spacing:.08em;color:#999}
.signal-sources span{width:100%;color:#d77a52}
.signal-sources a{text-decoration:underline;text-underline-offset:3px}
.data-section{padding-left:0;padding-right:0;overflow:hidden}
.data-section>.section-head,.data-section>.data-intro,.data-section>.evidence-heading,.data-section>.evidence-grid,.data-section>.evidence-note,.data-section>.fieldwork,.data-section>.note{margin-left:7vw;margin-right:7vw}
.explorer{width:100%;min-height:100svh;grid-template-columns:minmax(180px,.55fr) minmax(0,2.25fr) minmax(220px,.7fr);border-top:1px solid #111;border-bottom:1px solid #111}
.explorer-menu{padding:35px 22px 35px 7vw}
.explorer-main{padding:35px 24px;display:flex;flex-direction:column;justify-content:center}
.circle-stage{min-height:min(65vh,680px)}
.info-panel{padding:35px 7vw 35px 22px}
.evidence-heading{padding:100px 0 35px}
.evidence-heading h3{font-size:clamp(45px,8vw,100px);line-height:.92;letter-spacing:-.06em;margin:20px 0}
.evidence-heading p{max-width:700px;font-size:14px;line-height:1.8;color:var(--gray)}
.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.evidence-city{background:#e9e5eb;padding:clamp(22px,4vw,45px)}
.evidence-city>.eyebrow{color:var(--purple)}
.evidence-city h4{font-size:clamp(20px,2.5vw,30px);margin:18px 0 30px}
.evidence-stat{display:grid;grid-template-columns:110px 1fr;gap:5px 15px;align-items:end;padding:18px 0;border-top:1px solid #c8c0cb}
.evidence-value{font-size:clamp(35px,5vw,60px);font-weight:800;letter-spacing:-.06em;line-height:.95;color:var(--purple);grid-row:span 2}
.evidence-value span{font-size:.5em}
.evidence-label{font-size:11px;line-height:1.5}
.evidence-bar{height:5px;background:#d0cbd2;grid-column:2}
.evidence-bar i{display:block;height:100%;background:var(--purple)}
.evidence-foot{font-size:9px;line-height:1.7;color:#66616b;margin:25px 0 0}
.evidence-note{margin-top:18px;padding:22px 25px;background:#e5e0e8;border-left:3px solid var(--purple);font-size:11px;line-height:1.8;color:#514a55}
.evidence-note strong{color:#161216}
.fieldwork{display:grid;grid-template-columns:1fr 1.2fr;gap:45px;padding:100px 0}
.fieldwork .eyebrow{color:var(--purple)}
.fieldwork h3{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.05em;margin:20px 0}
.fieldwork p{font-size:12px;line-height:1.8;color:var(--gray);max-width:450px}
.fieldwork-items>div{display:grid;grid-template-columns:55px 1fr;gap:15px;padding:17px 0;border-top:1px solid var(--light);font-size:12px;line-height:1.5}
.fieldwork-items b{font:10px var(--mono);color:var(--purple)}
@media(max-width:1100px){
  .explorer{grid-template-columns:180px minmax(0,1fr)}
  .info-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--light);padding:25px 6vw;display:grid;grid-template-columns:220px 1fr;gap:25px}
  .info-panel .info-top,.info-panel .country-tabs{grid-column:1/-1}
}
@media(max-width:800px){
  .signal-grid,.signal-bottom,.culture-grid,.evidence-grid,.fieldwork{grid-template-columns:1fr}
  .signal-city{grid-template-columns:1fr}
  .signal-city-head{grid-column:auto}
  .explorer{grid-template-columns:1fr;min-height:0}
  .explorer-menu{padding:20px 6vw;display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
  .explorer-main{padding:25px 6vw}
  .circle-stage{min-height:65vh}
  .info-panel{display:block;padding:25px 6vw}
  .data-section>.section-head,.data-section>.data-intro,.data-section>.evidence-heading,.data-section>.evidence-grid,.data-section>.evidence-note,.data-section>.fieldwork,.data-section>.note{margin-left:6vw;margin-right:6vw}
}


.evidence-link{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;font:9px var(--mono);letter-spacing:.07em}
.evidence-link a{color:var(--purple);text-decoration:underline;text-underline-offset:3px}
.evidence-note .evidence-link{margin-top:12px}
